[workspace]

[package]
name = "nexus-watcher"
version = "0.1.0"
edition = "2024"
description = "Standalone file watcher for Claude Code session detection via notify"

[[bin]]
name = "nexus-watcher"
path = "src/main.rs"

[dependencies]
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "io-std", "macros", "sync", "signal", "time", "fs", "process"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
