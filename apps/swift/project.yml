name: nexus

# ──────────────────────────────────────────────────────────────────────
# XcodeGen manifest for the Nexus Apple ecosystem.
#
# Three app targets + one shared framework. Source dirs:
#   nexus/nexus/         macOS menu bar app (EXISTING — pre-XcodeGen)
#   nexus-ios/           iOS client (TO CREATE)
#   nexus-watch/         watchOS companion (TO CREATE)
#   NexusShared/         shared models, networking, observers (TO CREATE)
#
# Regenerate the .xcodeproj:
#   cd apps/swift && xcodegen generate
#
# WARNING: regeneration overwrites nexus.xcodeproj/project.pbxproj.
# Before first regen, audit this manifest against current Xcode settings
# (signing team, custom build phases, asset catalogs, capabilities). The
# Info.plist + .entitlements files referenced below stay outside the
# project file and survive regeneration.
# ──────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: dev.leonardoacosta.nexus
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # DEVELOPMENT_TEAM: set per-machine in xcconfig or via Xcode UI

# ──────────────────────────────────────────────────────────────────────
# Shared framework — models, NexusClient, SSE/WS subscribers,
# TTS synthesis, audio playback, settings store.
#
# Initial scope: macOS only. iOS + watchOS variants are added by the
# `scaffold-nexus-ios-target` / `scaffold-nexus-watch-target` specs when
# those source trees land. Today only `nexus-mac` consumes NexusShared.
# ──────────────────────────────────────────────────────────────────────
targets:

  NexusShared:
    type: framework
    platform: macOS
    sources:
      - path: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  # ────────────────── macOS — menu bar app (existing) ──────────────────
  #
  # Sources span two trees:
  #   nexus/nexus/           — pre-XcodeGen menu bar app (views, AppDelegate)
  #   nexus-mac/Sources/     — new files shipped by P4.5+P4.6 (AudioPlayer,
  #                            ElevenLabsSettingsView) that depend on
  #                            NexusShared.ElevenLabsClient + Keychain.
  nexus-mac:
    type: application
    platform: macOS
    sources:
      - path: nexus/nexus
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: nexus-mac/Sources
    dependencies:
      - target: NexusShared
    info:
      path: nexus/nexus/Info.plist
    entitlements:
      path: nexus/nexus/nexus.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.mac
        PRODUCT_NAME: nexus
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Nexus menu bar client."
        ENABLE_HARDENED_RUNTIME: YES

  nexus-mac-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: nexus/nexusTests
      - path: nexus-mac/Tests
    dependencies:
      - target: nexus-mac
      - target: NexusShared

  nexus-mac-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: nexus/nexusUITests
    dependencies:
      - target: nexus-mac

  # ────────────────── iOS / watchOS — deferred ─────────────────────────
  #
  # The iOS + watchOS targets are added by `scaffold-nexus-ios-target` and
  # `scaffold-nexus-watch-target` when those source trees land. Until then
  # the manifest is macOS-only so xcodegen generate succeeds without those
  # directories existing on disk.
