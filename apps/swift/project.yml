name: nexus

# ──────────────────────────────────────────────────────────────────────
# XcodeGen manifest for the Nexus Apple ecosystem.
#
# Three app targets + one shared framework. Source dirs:
#   nexus/nexus/         macOS menu bar app (EXISTING — pre-XcodeGen)
#   nexus-ios/           iOS client (TO CREATE)
#   nexus-watch/         watchOS companion (TO CREATE)
#   NexusShared/         shared models, networking, observers (TO CREATE)
#
# Regenerate the .xcodeproj:
#   cd apps/swift && xcodegen generate
#
# WARNING: regeneration overwrites nexus.xcodeproj/project.pbxproj.
# Before first regen, audit this manifest against current Xcode settings
# (signing team, custom build phases, asset catalogs, capabilities). The
# Info.plist + .entitlements files referenced below stay outside the
# project file and survive regeneration.
# ──────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: dev.leonardoacosta.nexus
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # DEVELOPMENT_TEAM: set per-machine in xcconfig or via Xcode UI

# ──────────────────────────────────────────────────────────────────────
# Shared framework — models, NexusClient, SSE/WS subscribers,
# TTS synthesis, audio playback, settings store.
#
# Initial scope: macOS only. iOS + watchOS variants are added by the
# `scaffold-nexus-ios-target` / `scaffold-nexus-watch-target` specs when
# those source trees land. Today only `nexus-mac` consumes NexusShared.
# ──────────────────────────────────────────────────────────────────────
targets:

  NexusShared:
    type: framework
    supportedDestinations: [macOS, iOS, watchOS]
    sources:
      - path: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  NexusSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NexusSharedTests
    dependencies:
      - target: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared.tests

  # ────────────────── macOS — menu bar app (existing) ──────────────────
  #
  # Sources span two trees:
  #   nexus/nexus/           — pre-XcodeGen menu bar app (views, AppDelegate)
  #   nexus-mac/Sources/     — new files shipped by P4.5+P4.6 (AudioPlayer,
  #                            ElevenLabsSettingsView) that depend on
  #                            NexusShared.ElevenLabsClient + Keychain.
  nexus-mac:
    type: application
    platform: macOS
    sources:
      - path: nexus/nexus
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: nexus-mac/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
    # The nexus-mac scheme is the canonical Swift test entry point for the
    # integration gate (deploy/hooks.d/pre-push/01-deploy runs
    # `xcodebuild test -scheme nexus-mac -only-testing:<bundle>`). XcodeGen
    # only auto-attaches test targets that depend on nexus-mac, so
    # NexusSharedTests (it depends on NexusShared, not the app) would be
    # invisible to the gate. Listing all three explicitly makes
    # `-only-testing:NexusSharedTests` / `:nexus-mac-UITests` runnable from
    # the one gated scheme. Spec: add-fullstack-integration-test-gate 2.x.
    scheme:
      testTargets:
        - nexus-mac-Tests
        - NexusSharedTests
        - nexus-mac-UITests
    # Info.plist is XcodeGen-generated. The nested NSAppTransportSecurity
    # dict cannot be expressed via flat INFOPLIST_KEY_* build settings, so
    # it lives in `info:` properties. (The static nexus/nexus/Info.plist is
    # the legacy pre-XcodeGen target's plist and is never consumed here —
    # nexus-mac builds with GENERATE_INFOPLIST_FILE semantics.)
    #
    # ATS exception (bd:nx-p2zs5): Nexus agents are reached over plain HTTP
    # on raw Tailscale CGNAT IPs (e.g. http://100.73.182.4:7400). The wire
    # is already WireGuard-encrypted by Tailscale, so app-layer TLS is
    # intentionally not used. NSExceptionDomains keyed by a bare IP literal
    # is unreliable, and this is an internal dashboard (not an App Store
    # build), so NSAllowsArbitraryLoads is the correct minimal allowance.
    # Tailscale-HTTPS hardening tracked separately in nx-p2zs5.
    info:
      path: nexus-mac/Generated/Info.plist
      properties:
        LSUIElement: true
        ATSApplicationFontsPath: Fonts
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Nexus menu bar client."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.mac
        PRODUCT_NAME: nexus
        CODE_SIGN_ENTITLEMENTS: nexus/nexus/nexus.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  nexus-mac-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: nexus/nexusTests
      - path: nexus-mac/Tests
    dependencies:
      - target: nexus-mac
      - target: NexusShared
    settings:
      base:
        # nexus-mac's PRODUCT_NAME is `nexus`, so the host bundle is
        # `nexus.app/Contents/MacOS/nexus` — NOT the target-name-derived
        # `nexus-mac.app/.../nexus-mac` XcodeGen defaults to. Without this
        # the whole nexus-mac scheme fails to build ("Could not find test
        # host"), which would also break the pre-push integration gate
        # (it runs `xcodebuild test -scheme nexus-mac`).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nexus.app/Contents/MacOS/nexus"
        BUNDLE_LOADER: "$(TEST_HOST)"

  nexus-mac-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: nexus/nexusUITests
    dependencies:
      - target: nexus-mac

  # ─────────────────────── iOS — scaffolded ────────────────────────────
  #
  # Source: apps/swift/nexus-ios/Sources (scaffolded by
  # scaffold-nexus-ios-target). The push entitlement + provisioning
  # profile land via bd:nx-gsgvk; until then the .entitlements file is
  # intentionally minimal.
  nexus-ios:
    type: application
    platform: iOS
    sources:
      - path: nexus-ios/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.ios
        PRODUCT_NAME: nexus
        INFOPLIST_FILE: nexus-ios/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: nexus-ios/Resources/nexus-ios.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: NO

  # ─────────────────────── watchOS — scaffolded ────────────────────────
  #
  # Source: apps/swift/nexus-watch/Sources (scaffolded by
  # scaffold-nexus-watch-target). Pairing + provisioning land via
  # bd:nx-gsgvk.
  nexus-watch:
    type: application
    platform: watchOS
    sources:
      - path: nexus-watch/Sources
    dependencies:
      - target: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.watch
        PRODUCT_NAME: nexus-watch
        INFOPLIST_FILE: nexus-watch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: nexus-watch/Resources/nexus-watch.entitlements
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

# ──────────────────────────────────────────────────────────────────────
# Swift Package Manager dependencies — resolved by Xcode on first build.
# ──────────────────────────────────────────────────────────────────────
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
