name: nexus

# ──────────────────────────────────────────────────────────────────────
# XcodeGen manifest for the Nexus Apple ecosystem.
#
# Three app targets + one shared framework. Source dirs:
#   nexus/nexus/         macOS menu bar app (EXISTING — pre-XcodeGen)
#   nexus-ios/           iOS client (TO CREATE)
#   nexus-watch/         watchOS companion (TO CREATE)
#   NexusShared/         shared models, networking, observers (TO CREATE)
#
# Regenerate the .xcodeproj:
#   cd apps/swift && xcodegen generate
#
# WARNING: regeneration overwrites nexus.xcodeproj/project.pbxproj.
# Before first regen, audit this manifest against current Xcode settings
# (signing team, custom build phases, asset catalogs, capabilities). The
# Info.plist + .entitlements files referenced below stay outside the
# project file and survive regeneration.
# ──────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: dev.leonardoacosta.nexus
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # DEVELOPMENT_TEAM: set per-machine in xcconfig or via Xcode UI

# ──────────────────────────────────────────────────────────────────────
# Shared framework — models, NexusClient, SSE/WS subscribers,
# TTS synthesis, audio playback, settings store.
#
# Initial scope: macOS only. iOS + watchOS variants are added by the
# `scaffold-nexus-ios-target` / `scaffold-nexus-watch-target` specs when
# those source trees land. Today only `nexus-mac` consumes NexusShared.
# ──────────────────────────────────────────────────────────────────────
targets:

  NexusShared:
    type: framework
    platform: [macOS, iOS, watchOS]
    sources:
      - path: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  NexusSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NexusSharedTests
    dependencies:
      - target: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared.tests

  # ────────────────── macOS — menu bar app (existing) ──────────────────
  #
  # Sources span two trees:
  #   nexus/nexus/           — pre-XcodeGen menu bar app (views, AppDelegate)
  #   nexus-mac/Sources/     — new files shipped by P4.5+P4.6 (AudioPlayer,
  #                            ElevenLabsSettingsView) that depend on
  #                            NexusShared.ElevenLabsClient + Keychain.
  nexus-mac:
    type: application
    platform: macOS
    sources:
      - path: nexus/nexus
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: nexus-mac/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
    info:
      path: nexus/nexus/Info.plist
    entitlements:
      path: nexus/nexus/nexus.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.mac
        PRODUCT_NAME: nexus
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Nexus menu bar client."
        ENABLE_HARDENED_RUNTIME: YES

  nexus-mac-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: nexus/nexusTests
      - path: nexus-mac/Tests
    dependencies:
      - target: nexus-mac
      - target: NexusShared

  nexus-mac-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: nexus/nexusUITests
    dependencies:
      - target: nexus-mac

  # ─────────────────────── iOS — scaffolded ────────────────────────────
  #
  # Source: apps/swift/nexus-ios/Sources (scaffolded by
  # scaffold-nexus-ios-target). The push entitlement + provisioning
  # profile land via bd:nx-gsgvk; until then the .entitlements file is
  # intentionally minimal.
  nexus-ios:
    type: application
    platform: iOS
    sources:
      - path: nexus-ios/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
    info:
      path: nexus-ios/Resources/Info.plist
    entitlements:
      path: nexus-ios/Resources/nexus-ios.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.ios
        PRODUCT_NAME: nexus
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: NO

  # ─────────────────────── watchOS — scaffolded ────────────────────────
  #
  # Source: apps/swift/nexus-watch/Sources (scaffolded by
  # scaffold-nexus-watch-target). Pairing + provisioning land via
  # bd:nx-gsgvk.
  nexus-watch:
    type: application
    platform: watchOS
    sources:
      - path: nexus-watch/Sources
    dependencies:
      - target: NexusShared
    info:
      path: nexus-watch/Resources/Info.plist
    entitlements:
      path: nexus-watch/Resources/nexus-watch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.watch
        PRODUCT_NAME: nexus-watch
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

# ──────────────────────────────────────────────────────────────────────
# Swift Package Manager dependencies — resolved by Xcode on first build.
# ──────────────────────────────────────────────────────────────────────
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
