name: nexus

# ──────────────────────────────────────────────────────────────────────
# XcodeGen manifest for the Nexus Apple ecosystem.
#
# Three app targets + one shared framework. Source dirs:
#   nexus/nexus/         macOS menu bar app (EXISTING — pre-XcodeGen)
#   nexus-ios/           iOS client (TO CREATE)
#   nexus-watch/         watchOS companion (TO CREATE)
#   NexusShared/         shared models, networking, observers (TO CREATE)
#
# Regenerate the .xcodeproj:
#   cd apps/swift && xcodegen generate
#
# WARNING: regeneration overwrites nexus.xcodeproj/project.pbxproj.
# Before first regen, audit this manifest against current Xcode settings
# (signing team, custom build phases, asset catalogs, capabilities). The
# Info.plist + .entitlements files referenced below stay outside the
# project file and survive regeneration.
# ──────────────────────────────────────────────────────────────────────

options:
  bundleIdPrefix: dev.leonardoacosta.nexus
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    # Stable signing identity (nx-n2o0a): an ad-hoc-signed build (no team) gets
    # an unstable code identity, so macOS never persists the notification grant
    # and banner posts fail UNErrorDomain Code=1 despite Settings showing "on".
    # Pinning the Developer Program team gives the app a stable signed identity
    # (the existing "Mac Team Provisioning Profile: dev.leonardoacosta.nexus.mac"
    # carries the Push + iCloud caps) so the grant sticks across rebuilds.
    # NOTE: DX3Y367L2A is the TEAM (the cert's OU). The "(4RMU5SA5Z4)" suffix in
    # the cert Common Name is an Apple-ID identifier, NOT the team — do not use it.
    DEVELOPMENT_TEAM: DX3Y367L2A
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# ──────────────────────────────────────────────────────────────────────
# Shared framework — models, NexusClient, SSE/WS subscribers,
# TTS synthesis, audio playback, settings store.
#
# Initial scope: macOS only. iOS + watchOS variants are added by the
# `scaffold-nexus-ios-target` / `scaffold-nexus-watch-target` specs when
# those source trees land. Today only `nexus-mac` consumes NexusShared.
# ──────────────────────────────────────────────────────────────────────
targets:

  NexusShared:
    type: framework
    supportedDestinations: [macOS, iOS, watchOS]
    sources:
      - path: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  NexusSharedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NexusSharedTests
    dependencies:
      - target: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.shared.tests
        # Test bundles need a generated Info.plist to be code-signable.
        # The integration-gate Tier B build signs (ad-hoc) so the
        # XCUITest runner can attach; without this the whole scheme
        # fails: "Cannot code sign because the target does not have an
        # Info.plist file" (bd:nx-68ulr).
        GENERATE_INFOPLIST_FILE: YES

  # ────────────────── macOS — menu bar app (existing) ──────────────────
  #
  # Sources span two trees:
  #   nexus/nexus/           — pre-XcodeGen menu bar app (views, AppDelegate)
  #   nexus-mac/Sources/     — new files shipped by P4.5+P4.6 (AudioPlayer,
  #                            Settings/SettingsXxxView) that depend on
  #                            NexusShared.ElevenLabsClient + Keychain.
  #                            (ElevenLabsSettingsView was absorbed into
  #                            SettingsTtsView by settings-tab-redesign.)
  nexus-mac:
    type: application
    platform: macOS
    sources:
      - path: nexus/nexus
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: nexus-mac/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
      - package: MarkdownUI
        product: MarkdownUI
    # The nexus-mac scheme is the canonical Swift test entry point for the
    # integration gate (deploy/hooks.d/pre-push/01-deploy runs
    # `xcodebuild test -scheme nexus-mac -only-testing:<bundle>`). XcodeGen
    # only auto-attaches test targets that depend on nexus-mac, so
    # NexusSharedTests (it depends on NexusShared, not the app) would be
    # invisible to the gate. Listing all three explicitly makes
    # `-only-testing:NexusSharedTests` / `:nexus-mac-UITests` runnable from
    # the one gated scheme. Spec: add-fullstack-integration-test-gate 2.x.
    scheme:
      testTargets:
        - nexus-mac-Tests
        - NexusSharedTests
        - nexus-mac-UITests
    # Info.plist is XcodeGen-generated. The nested NSAppTransportSecurity
    # dict cannot be expressed via flat INFOPLIST_KEY_* build settings, so
    # it lives in `info:` properties. (The static nexus/nexus/Info.plist is
    # the legacy pre-XcodeGen target's plist and is never consumed here —
    # nexus-mac builds with GENERATE_INFOPLIST_FILE semantics.)
    #
    # ATS exception (bd:nx-p2zs5): Nexus agents are reached over plain HTTP
    # on raw Tailscale CGNAT IPs (e.g. http://100.73.182.4:7400). The wire
    # is already WireGuard-encrypted by Tailscale, so app-layer TLS is
    # intentionally not used. NSExceptionDomains keyed by a bare IP literal
    # is unreliable, and this is an internal dashboard (not an App Store
    # build), so NSAllowsArbitraryLoads is the correct minimal allowance.
    # Tailscale-HTTPS hardening tracked separately in nx-p2zs5.
    info:
      path: nexus-mac/Generated/Info.plist
      properties:
        # LSUIElement=false makes Nexus.app a regular .regular activation
        # policy app — appears in Dock, Cmd-Tab switcher, and force-quit
        # dialog. We previously ran as a pure menu-bar-only app
        # (LSUIElement=true → .accessory policy), but Leo's workflow needs
        # Cmd-Tab to bring the dashboard forward without hunting for the
        # status item. The MenuBarExtra status item still renders alongside
        # the Dock entry; both coexist with .regular policy.
        LSUIElement: false
        ATSApplicationFontsPath: Fonts
        # nx-20caf: capitalised display name so System Settings ->
        # Notifications (and the Dock/Cmd-Tab label) read "Nexus" rather than
        # the lowercase PRODUCT_NAME ("nexus"). CFBundleDisplayName is purely
        # cosmetic and independent of PRODUCT_NAME / CFBundleName, so the
        # built binary stays `nexus` and bundle identifiers are unchanged.
        CFBundleDisplayName: Nexus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "Nexus menu bar client."
        # airpods-stt-command: TCC usage strings for the AirPods double-press
        # dictation command. Requested lazily on first dictation attempt.
        # On-device recognition (requiresOnDeviceRecognition = true) — no
        # audio leaves the Mac. The microphone entitlement
        # (com.apple.security.device.audio-input) lives in nexus.entitlements
        # because the app runs sandboxed.
        NSMicrophoneUsageDescription: "Nexus uses the microphone to dictate a spoken reply to the session that spoke the last notification, triggered by an AirPods double-press."
        NSSpeechRecognitionUsageDescription: "Nexus transcribes your spoken reply on-device to send it to the active Claude session."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.mac
        PRODUCT_NAME: nexus
        CODE_SIGN_ENTITLEMENTS: nexus/nexus/nexus.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  nexus-mac-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: nexus/nexusTests
      - path: nexus-mac/Tests
    dependencies:
      - target: nexus-mac
      - target: NexusShared
    settings:
      base:
        # nexus-mac's PRODUCT_NAME is `nexus`, so the host bundle is
        # `nexus.app/Contents/MacOS/nexus` — NOT the target-name-derived
        # `nexus-mac.app/.../nexus-mac` XcodeGen defaults to. Without this
        # the whole nexus-mac scheme fails to build ("Could not find test
        # host"), which would also break the pre-push integration gate
        # (it runs `xcodebuild test -scheme nexus-mac`).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/nexus.app/Contents/MacOS/nexus"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Signable test bundle (see NexusSharedTests note, bd:nx-68ulr).
        GENERATE_INFOPLIST_FILE: YES

  nexus-mac-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: nexus/nexusUITests
    dependencies:
      - target: nexus-mac
    settings:
      base:
        # Signable UITest bundle (see NexusSharedTests note,
        # bd:nx-68ulr). The XCUITest runner is killed before it can
        # attach unless app + runner + xctest are signed.
        GENERATE_INFOPLIST_FILE: YES

  # ─────────────────────── iOS — scaffolded ────────────────────────────
  #
  # Source: apps/swift/nexus-ios/Sources (scaffolded by
  # scaffold-nexus-ios-target). The push entitlement + provisioning
  # profile land via bd:nx-gsgvk; until then the .entitlements file is
  # intentionally minimal.
  nexus-ios:
    type: application
    platform: iOS
    sources:
      - path: nexus-ios/Sources
    dependencies:
      - target: NexusShared
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.ios
        PRODUCT_NAME: nexus
        INFOPLIST_FILE: nexus-ios/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: nexus-ios/Resources/nexus-ios.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        ENABLE_HARDENED_RUNTIME: NO

  # ─────────────────────── watchOS — scaffolded ────────────────────────
  #
  # Source: apps/swift/nexus-watch/Sources (scaffolded by
  # scaffold-nexus-watch-target). Pairing + provisioning land via
  # bd:nx-gsgvk.
  nexus-watch:
    type: application
    platform: watchOS
    sources:
      - path: nexus-watch/Sources
    dependencies:
      - target: NexusShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonardoacosta.nexus.watch
        PRODUCT_NAME: nexus-watch
        INFOPLIST_FILE: nexus-watch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: nexus-watch/Resources/nexus-watch.entitlements
        SWIFT_VERSION: "5.10"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

# ──────────────────────────────────────────────────────────────────────
# Swift Package Manager dependencies — resolved by Xcode on first build.
# ──────────────────────────────────────────────────────────────────────
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  # swift-markdown-ui (gonzalezreal) — full GitHub-Flavored Markdown rendering
  # for SwiftUI. Replaces the AttributedString(interpretedSyntax:
  # .inlineOnlyPreservingWhitespace) path in SpecDetailView, which only handled
  # bold/italic/inline-code and rendered headings, fenced code blocks, lists,
  # and HTML comments as raw text. nx-lm5y4.
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
