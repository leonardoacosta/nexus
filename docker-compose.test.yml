# docker-compose.test.yml — PostgreSQL service for running integration tests locally and in CI.
#
# Usage:
#   1. Start the database:
#        docker compose -f docker-compose.test.yml up -d
#
#   2. Wait for it to be healthy (or just sleep 2s):
#        docker compose -f docker-compose.test.yml ps
#
#   3. Apply the schema:
#        POSTGRES_URL=postgres://nexus:nexus@localhost:5433/nexus_test pnpm --filter @nexus/db db:push
#
#   4. Run the agent integration tests:
#        POSTGRES_URL=postgres://nexus:nexus@localhost:5433/nexus_test bun test apps/agent/src/routes/sessions.test.ts
#
#   5. Tear down when done:
#        docker compose -f docker-compose.test.yml down -v
#
# CI: Set the POSTGRES_URL secret and start this service in your workflow before running tests.
#     Example GitHub Actions step:
#       - run: docker compose -f docker-compose.test.yml up -d
#       - run: sleep 3  # wait for postgres to accept connections
#       - run: POSTGRES_URL=postgres://nexus:nexus@localhost:5433/nexus_test bun test apps/agent/src/

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
