name: CI

# Neutral Linux CI gate. Runs the *existing* quality gates (typecheck / lint /
# lint:sql-safety / test) against a throwaway Postgres, so correctness no longer
# depends on any individual contributor's OS or git-hook state. Complements the
# local pre-push hook (deploy/hooks.d/pre-push/01-deploy); does not replace it.
#
# ── GATES ARE BLOCKING ─────────────────────────────────────────────────────
# All gates below (typecheck / lint / lint:sql-safety / test) are real,
# blocking steps and green as of this change. `lint` is ratcheted to
# `--max-warnings 0` per workspace so a newly introduced warning fails CI
# instead of accumulating silently. Do NOT add `continue-on-error` — fix the
# source instead.

on:
  push:
  pull_request:

jobs:
  linux-gates:
    name: Linux gates (typecheck / lint / test)
    runs-on: ubuntu-latest
    env:
      # Points at the docker-compose.test.yml Postgres (host port 5433).
      POSTGRES_URL: postgres://nexus:nexus@localhost:5433/nexus_test
      # REQUIRED — apps/agent/src/testing/live-pg.ts gates PG-backed tests on
      # NEXUS_PG_TESTS=1 AND POSTGRES_URL. Omitting this leaves those suites
      # silently skipped (green but hollow) even with the container up.
      NEXUS_PG_TESTS: "1"
      # Test-only value read by notifications-deliver.test.ts. Not a real secret.
      NEXUS_ATTACH_SECRET: test
      # NOTE: NEXUS_HEAVY_TESTS is deliberately NOT set — it would opt in
      # live-homelab Tailscale round-trips that need a real peer and fail in CI.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Guard against a second lockfile
        run: '! git ls-files | grep -E "pnpm-lock|yarn.lock|package-lock"'
      - run: bun install --frozen-lockfile
      # `--wait` blocks until the compose pg_isready healthcheck reports healthy.
      - run: docker compose -f docker-compose.test.yml up -d --wait
      # Apply the schema to the fresh compose Postgres BEFORE any PG-backed test
      # runs — the container boots an empty `nexus_test` DB, so migrating first
      # is what keeps those suites from hitting missing tables. Uses the
      # job-level POSTGRES_URL (same value the test step reads). Migration-based
      # ONLY (`db:migrate` = `bun ./src/migrate.ts`); NEVER `db:push`.
      - name: Apply DB schema
        run: bun run --filter=@nexus/db db:migrate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:sql-safety
      - run: bun run test
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Cheap Linux job so `macos-swift` below never dispatches the Mac runner on a
  # TS-only push — `needs` + `if` skips the whole job rather than just
  # short-circuiting its steps.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'apps/swift/**'
              - '.github/workflows/ci.yml'

  # Runner is Leo's own Mac, registered as a GitHub Actions self-hosted runner
  # (name `nexus-mac-runner`, labels self-hosted/macOS/ARM64/nexus-mac). Chosen
  # because the managed macOS options (Blacksmith, Depot) both require an
  # org-owned repo and leonardoacosta/nexus is a personal-account repo.
  #
  # Consequences this job cannot enforce itself:
  #   - The Mac must be awake and network-reachable, or the job queues until it
  #     is. A sleeping Mac is a stalled job, not a failure.
  #   - The runner is a launchd user agent
  #     (actions.runner.leonardoacosta-nexus.nexus-mac-runner), managed on the
  #     Mac via `~/actions-runner/svc.sh {status,start,stop}`. It survives
  #     reboot but only runs while Leo's user session is loaded.
  #   - The workspace is NOT ephemeral. Steps must stay idempotent across runs
  #     (`brew install xcodegen` is a no-op when already present).
  macos-swift:
    name: Swift gates (nexus-mac, NexusShared)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: [self-hosted, macOS, nexus-mac]
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd apps/swift && xcodegen generate
      - run: |
          xcodebuild test \
            -project apps/swift/nexus.xcodeproj \
            -scheme nexus-mac \
            -destination 'platform=macOS' \
            -only-testing:nexus-mac-Tests \
            -only-testing:NexusSharedTests \
            CODE_SIGNING_ALLOWED=NO

# Follow-up: iOS/watch bundle coverage is a separate gap — see plans/014.
