syntax = "proto3";

package nexus.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum SessionStatus {
  SESSION_STATUS_UNKNOWN = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_IDLE = 2;
  SESSION_STATUS_STALE = 3;
  SESSION_STATUS_ERRORED = 4;
}

enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_MANAGED = 1;
  SESSION_TYPE_AD_HOC = 2;
  SESSION_TYPE_POOLED = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SESSION_STARTED = 1;
  EVENT_TYPE_HEARTBEAT_RECEIVED = 2;
  EVENT_TYPE_STATUS_CHANGED = 3;
  EVENT_TYPE_SESSION_STOPPED = 4;
  EVENT_TYPE_GOING_AWAY = 5;
}

// ---------------------------------------------------------------------------
// Telemetry messages
// ---------------------------------------------------------------------------

message RateLimitInfo {
  float utilization_percent = 1;
  string rate_limit_type = 2;
  bool surpassed_threshold = 3;
}

message SessionTelemetry {
  optional RateLimitInfo rate_limit = 1;
  optional double total_cost_usd = 2;
  optional string model = 3;
}

// ---------------------------------------------------------------------------
// Session messages
// ---------------------------------------------------------------------------

message Session {
  string id = 1;
  uint32 pid = 2;
  optional string project = 3;
  string cwd = 4;
  optional string branch = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp last_heartbeat = 7;
  SessionStatus status = 8;
  SessionType session_type = 9;
  optional string spec = 10;
  optional string command = 11;
  optional string agent = 12;
  optional string tmux_session = 13;
  optional string cc_session_id = 14;
  optional SessionTelemetry telemetry = 15;
  optional string tmux_target = 16;
}

message SessionId {
  string id = 1;
}

message SessionFilter {
  optional SessionStatus status = 1;
  optional string project = 2;
  optional SessionType session_type = 3;
}

message SessionList {
  repeated Session sessions = 1;
  string agent_name = 2;
  string agent_host = 3;
}

// ---------------------------------------------------------------------------
// Session lifecycle RPCs
// ---------------------------------------------------------------------------

message StartSessionRequest {
  string project = 1;
  string cwd = 2;
  repeated string args = 3;
  optional string target_agent = 4;
}

message StartSessionResponse {
  string session_id = 1;
  string tmux_session = 2;
  SessionType session_type = 3;
}

message StopResult {
  bool success = 1;
  optional string message = 2;
}

message RegisterSessionRequest {
  string session_id = 1;
  uint32 pid = 2;
  string cwd = 3;
  optional string project = 4;
  optional string branch = 5;
  optional string command = 6;
}

message RegisterSessionResponse {
  string session_id = 1;
  bool created = 2;
}

message UnregisterSessionRequest {
  string session_id = 1;
}

message UnregisterSessionResponse {
  bool found = 1;
}

message HeartbeatRequest {
  string session_id = 1;
}

message HeartbeatResponse {
  bool found = 1;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNCED = 1;
  BEHIND = 2;
  UNKNOWN = 3;
}

message ProjectInfo {
  string name = 1;
  optional string path = 2;
  optional string git_branch = 3;
  optional string last_commit = 4;
  SyncStatus sync_status = 5;
  optional int32 commits_behind = 6;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated string projects = 1;
  repeated ProjectInfo project_details = 2;
}

message AgentInfo {
  string name = 1;
  string host = 2;
  uint32 port = 3;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// ---------------------------------------------------------------------------
// Command broker
// ---------------------------------------------------------------------------

message CommandRequest {
  string session_id = 1;
  string prompt = 2;
  optional string project = 3;
}

message CommandOutput {
  string session_id = 1;
  oneof content {
    TextChunk text = 2;
    ToolUseInfo tool_use = 3;
    ToolResult tool_result = 4;
    CommandError error = 5;
    CommandDone done = 6;
    ProgressUpdate progress = 7;
  }
}

message TextChunk {
  string text = 1;
  bool partial = 2;
}

message ToolUseInfo {
  string tool_name = 1;
  string input_preview = 2;
}

message ToolResult {
  string tool_name = 1;
  string output_preview = 2;
  bool success = 3;
}

message CommandError {
  string message = 1;
  int32 exit_code = 2;
}

message CommandDone {
  uint64 duration_ms = 1;
  uint32 tool_calls = 2;
}

message ProgressUpdate {
  string phase = 1;
  optional float percent = 2;
  string summary = 3;
}

// ---------------------------------------------------------------------------
// Streaming events
// ---------------------------------------------------------------------------

message EventFilter {
  optional string session_id = 1;
  repeated EventType event_types = 2;
  bool initial_snapshot = 3;
}

message SessionEvent {
  string session_id = 1;
  google.protobuf.Timestamp ts = 2;
  oneof payload {
    SessionStarted started = 3;
    HeartbeatReceived heartbeat = 4;
    StatusChanged status_changed = 5;
    SessionStopped stopped = 6;
    GoingAway going_away = 8;
  }
  string agent_name = 7;
}

message SessionStarted {
  Session session = 1;
  bool is_snapshot = 2;
}

message HeartbeatReceived {
  google.protobuf.Timestamp last_heartbeat = 1;
}

message StatusChanged {
  SessionStatus old_status = 1;
  SessionStatus new_status = 2;
}

message SessionStopped {
  string reason = 1;
}

message GoingAway {
  string reason = 1;
  uint32 drain_timeout_ms = 2;
}

message StatusTransition {
  SessionStatus from_status = 1;
  SessionStatus to_status = 2;
  google.protobuf.Timestamp at = 3;
  string reason = 4;
}

// ---------------------------------------------------------------------------
// Health
// ---------------------------------------------------------------------------

message ContainerStatus {
  string name = 1;
  bool running = 2;
}

message MachineHealth {
  float cpu_percent = 1;
  float memory_used_gb = 2;
  float memory_total_gb = 3;
  float disk_used_gb = 4;
  float disk_total_gb = 5;
  repeated float load_avg = 6;
  uint64 uptime_seconds = 7;
  repeated ContainerStatus docker_containers = 8;
}

message HealthRequest {}

message HealthResponse {
  string agent_name = 1;
  string agent_host = 2;
  uint64 uptime_seconds = 3;
  uint32 session_count = 4;
  optional MachineHealth machine = 5;
  optional RateLimitInfo latest_rate_limit = 6;
}

// ---------------------------------------------------------------------------
// Project Status
// ---------------------------------------------------------------------------

message BeadsStatus {
  int32 ready_count = 1;
  int32 open_count = 2;
  int32 blocked_count = 3;
  string ready_json = 4;
}

message GitStatusInfo {
  string branch = 1;
  string head_sha = 2;
  repeated string recent_commits = 3;
  string porcelain = 4;
}

message SpecStatusInfo {
  int32 spec_count = 1;
  int32 change_count = 2;
  repeated string active_changes = 3;
}

message ProjectStatusRequest {
  string project = 1;
  bool fresh = 2;
}

message ProjectStatusResponse {
  string project = 1;
  BeadsStatus beads = 2;
  GitStatusInfo git = 3;
  SpecStatusInfo specs = 4;
}

// ---------------------------------------------------------------------------
// Command Registry
// ---------------------------------------------------------------------------

enum CommandTier {
  COMMAND_TIER_UNSPECIFIED = 0;
  COMMAND_TIER_STATUS = 1;
  COMMAND_TIER_ANALYSIS = 2;
  COMMAND_TIER_ACTION = 3;
}

enum CostCategory {
  COST_CATEGORY_UNSPECIFIED = 0;
  COST_CATEGORY_MINIMAL = 1;
  COST_CATEGORY_LOW = 2;
  COST_CATEGORY_MEDIUM = 3;
  COST_CATEGORY_HIGH = 4;
}

message CommandInfoProto {
  string name = 1;
  string namespace = 2;
  string full_name = 3;
  string description = 4;
  CommandTier tier = 5;
  CostCategory cost = 6;
}

message ListCommandsRequest {
  optional string namespace = 1;
  optional CommandTier tier = 2;
}

message ListCommandsResponse {
  repeated CommandInfoProto commands = 1;
}

message RunProjectCommandRequest {
  string project = 1;
  string command = 2;
  repeated string args = 3;
  bool fresh_session = 4;
}

// ---------------------------------------------------------------------------
// Analytics RPCs
// ---------------------------------------------------------------------------

message SessionHistoryRequest {
  uint32 days = 1;
  optional string project = 2;
}

message SessionHistoryEntry {
  string date = 1;
  int32 session_count = 2;
  double total_cost_usd = 3;
}

message SessionHistoryResponse {
  repeated SessionHistoryEntry entries = 1;
}

message FailureTrendsRequest {
  uint32 days = 1;
}

message FailureTrendEntry {
  string date = 1;
  int32 count = 2;
}

message FailureByTool {
  string tool_name = 1;
  int32 count = 2;
}

message FailureTrendsResponse {
  repeated FailureTrendEntry daily = 1;
  repeated FailureByTool by_tool = 2;
}

message HealthTimeSeriesRequest {
  uint32 hours = 1;
}

message HealthTimeSeriesEntry {
  string timestamp = 1;
  float cpu_percent = 2;
  float memory_used_gb = 3;
  float disk_used_gb = 4;
  float load1 = 5;
}

message HealthTimeSeriesResponse {
  repeated HealthTimeSeriesEntry samples = 1;
}

message SpecVelocityRequest {
  uint32 days = 1;
  optional string project = 2;
}

message SpecVelocityEntry {
  string date = 1;
  string project = 2;
  string spec_name = 3;
  int32 completed_tasks = 4;
  int32 total_tasks = 5;
}

message SpecVelocityResponse {
  repeated SpecVelocityEntry entries = 1;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service NexusAgent {
  rpc GetSessions(SessionFilter) returns (SessionList);
  rpc GetSession(SessionId) returns (Session);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc StreamEvents(EventFilter) returns (stream SessionEvent);
  rpc StopSession(SessionId) returns (StopResult);
  rpc RegisterSession(RegisterSessionRequest) returns (RegisterSessionResponse);
  rpc UnregisterSession(UnregisterSessionRequest) returns (UnregisterSessionResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc SendCommand(CommandRequest) returns (stream CommandOutput);
  rpc GetHealth(HealthRequest) returns (HealthResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetProjectStatus(ProjectStatusRequest) returns (ProjectStatusResponse);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc RunProjectCommand(RunProjectCommandRequest) returns (stream CommandOutput);
  rpc GetSessionHistory(SessionHistoryRequest) returns (SessionHistoryResponse);
  rpc GetFailureTrends(FailureTrendsRequest) returns (FailureTrendsResponse);
  rpc GetHealthTimeSeries(HealthTimeSeriesRequest) returns (HealthTimeSeriesResponse);
  rpc GetSpecVelocity(SpecVelocityRequest) returns (SpecVelocityResponse);
}
