# Traefik dynamic configuration — Nexus Dashboard
# Drop this file into your Traefik file-provider watch directory.
# Default path: /etc/traefik/dynamic/nexus-dashboard.yml
#
# Prerequisites on homelab:
#   1. Traefik static config has a `file` provider watching this directory
#   2. A `cloudflare` certResolver is configured in Traefik static config with
#      CF_DNS_API_TOKEN set in Traefik's environment (for DNS-01 ACME challenge)
#   3. nexus.leonardoacosta.dev DNS A record → this machine's Tailscale IP (DNS-only, no proxy)
#   4. nexus-dashboard systemd service is running on port 3100

http:
  routers:
    nexus-dashboard:
      rule: "Host(`nexus.leonardoacosta.dev`)"
      entryPoints:
        - websecure
      service: nexus-dashboard
      tls:
        certResolver: cloudflare

  services:
    nexus-dashboard:
      loadBalancer:
        servers:
          - url: "http://localhost:3100"
        passHostHeader: true
