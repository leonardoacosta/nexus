# Traefik dynamic configuration — Nexus Dashboard
# Drop this file into your Traefik file-provider watch directory.
# Default path: /etc/traefik/dynamic/nexus-dashboard.yml
#
# Prerequisites on the host running Traefik:
#   1. Traefik static config has a `file` provider watching this directory.
#   2. A `cloudflare` certResolver is configured in Traefik static config with
#      CF_DNS_API_TOKEN set in Traefik's environment (for DNS-01 ACME challenge).
#      If your cert resolver is named differently (e.g. `letsencrypt`, `cf`),
#      update the `certResolver:` value under `tls:` below.
#   3. nexus.leonardoacosta.dev DNS A record → this machine's reachable IP
#      (Tailscale IP if Traefik is on the tailnet; LAN IP otherwise). DNS-only,
#      no Cloudflare proxy — DNS-01 challenge needs the record to resolve to
#      the host running Traefik.
#   4. nexus-dashboard.service is running and bound to 127.0.0.1:3100.
#
# Mirrors the layout used by ~/dev/hl/homelab/traefik/dynamic/nexus-dashboard.yml
# — the homelab repo treats this file as the canonical upstream when present.

http:
  routers:
    nexus-dashboard:
      rule: "Host(`nexus.leonardoacosta.dev`)"
      entryPoints:
        - websecure
      service: nexus-dashboard
      tls:
        certResolver: cloudflare

  services:
    nexus-dashboard:
      loadBalancer:
        servers:
          # localhost binding — the dashboard systemd unit binds to PORT=3100
          # on the loopback interface. If Traefik runs in a different network
          # namespace (e.g. Docker), change this to the host's reachable IP
          # (the homelab repo currently uses 172.20.0.1:3100 for that reason).
          - url: "http://127.0.0.1:3100"
