[workspace]
members = ["crates/*"]
exclude = ["crates/archive"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/leonardoacosta/nexus"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["ws"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# WebSocket
tokio-tungstenite = "0.26"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.33"

# gRPC / Protobuf (still needed by nexus-core for proto types and nexus-register for gRPC client)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Streaming
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Hostname
hostname = "0.4"

# File watching
notify = "6"

# Concurrency
parking_lot = "0.12"

# Observability
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"] }
tracing-opentelemetry = "0.28"

# Shared crate
nexus-core = { path = "crates/nexus-core" }
