# Nexus Notification Configuration
# Copy to ~/.config/nexus/notifications.toml and customize.
#
# Controls which lifecycle events generate TTS notifications on the Primary agent.
# Only relevant when role = "primary" in agents.toml.

[defaults]
# Verbosity: "verbose" (full detail), "brief" (event type only), "silent" (suppress)
verbosity = "brief"
# Announce sub-agent spawns and completions
announce_agents = false
# Announce spec completions (all tasks done)
announce_specs = true
# Announce session start/stop
announce_sessions = false
# Always announce errors regardless of other settings
announce_errors = true
# Delivery channels: "tts", "apns", "banner", "telegram"
# `telegram` is a general-purpose, low-priority message lane delivered to a
# Telegram chat via the Bot API. Delivery requires TELEGRAM_BOT_TOKEN +
# TELEGRAM_CHAT_ID in the agent env (see .env.example); until both are
# provisioned the channel fails open (accepts the request, no-ops delivery).
channels = ["tts"]

# Per-project overrides. Unset fields inherit from [defaults].

[projects.oo]
verbosity = "verbose"
announce_agents = true

[projects.cc]
verbosity = "brief"

[projects.tl]
# Silent: suppress all notifications for this project
verbosity = "silent"

# ---------------------------------------------------------------------------
# Per-Project ElevenLabs Voices
# ---------------------------------------------------------------------------
# Maps project codes to ElevenLabs voice IDs for TTS notifications.
# Configured in ~/.claude/scripts/notifications/config/notifications.json
# under the "projectVoices" key.
#
# Fallback chain:
#   1. projectVoices.<code>   — project-specific voice
#   2. projectVoices.default  — shared fallback voice
#   3. elevenlabs.voiceId     — global default voice
#
# Example notifications.json snippet:
#   "projectVoices": {
#     "oo": "aKmZVXNhtFkOYNQj1qj9",   // Cortana voice for Otaku Odyssey
#     "tl": "IKne3meq5aSn9XLyUdCD",   // Different voice for Tavern Ledger
#     "default": "aKmZVXNhtFkOYNQj1qj9" // Fallback for unlisted projects
#   }
#
# Browse voices at https://elevenlabs.io/voice-library
# Voice IDs are visible in the ElevenLabs dashboard under Voice Settings.
